services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@host.docker.internal:5432/${POSTGRES_DB}
      CORS_ORIGINS: '["http://localhost:${FRONTEND_PORT:-5173}"]'
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      JWT_ISSUER: ${JWT_ISSUER:-mascot-api}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-mascot-frontend}
      AI_PROVIDER: ${AI_PROVIDER:-groq}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      GROQ_EXERCISE_MODEL: ${GROQ_EXERCISE_MODEL:-openai/gpt-oss-120b}
      GROQ_BASE_URL: ${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4-nano}
      AI_REQUEST_TIMEOUT_SECONDS: ${AI_REQUEST_TIMEOUT_SECONDS:-20}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-800}
      AI_EXERCISE_MAX_OUTPUT_TOKENS: ${AI_EXERCISE_MAX_OUTPUT_TOKENS:-5000}
      AI_EXERCISE_REASONING_EFFORT: ${AI_EXERCISE_REASONING_EFFORT:-medium}
      AI_MAX_TOOL_ROUNDS: ${AI_MAX_TOOL_ROUNDS:-5}
      AI_MAX_TOOL_CALLS_PER_ROUND: ${AI_MAX_TOOL_CALLS_PER_ROUND:-4}
      AI_MAX_TOTAL_TOOL_CALLS: ${AI_MAX_TOTAL_TOOL_CALLS:-8}
      AI_TOOL_MAX_ARGUMENT_BYTES: ${AI_TOOL_MAX_ARGUMENT_BYTES:-8192}
      AI_TOOL_MAX_PAYLOAD_BYTES: ${AI_TOOL_MAX_PAYLOAD_BYTES:-65536}
      AI_TOOL_TIMEOUT_SECONDS: ${AI_TOOL_TIMEOUT_SECONDS:-5}
      AI_ACTION_TOKEN_EXPIRE_SECONDS: ${AI_ACTION_TOKEN_EXPIRE_SECONDS:-300}
      AI_ACTION_TOKEN_AUDIENCE: ${AI_ACTION_TOKEN_AUDIENCE:-mascot-ai-action}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/database', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    extra_hosts:
       - "host.docker.internal:host-gateway"
  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:${BACKEND_PORT:-8000}/api/v1
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    # Keep the persistent development node_modules volume synchronized with
    # package-lock.json when frontend dependencies change between phases.
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

volumes:
  mascot_postgres_data:
  frontend_node_modules:
