[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mascot-backend"
version = "0.1.0"
description = "FastAPI backend foundation for Mascot"
requires-python = ">=3.11,<3.15"
dependencies = [
    "alembic>=1.14,<1.17",
    "argon2-cffi>=23.1,<26.0",
    "email-validator>=2.2,<3.0",
    "fastapi>=0.141,<0.142",
    "openai>=2.0,<3.0",
    "psycopg[binary]>=3.2,<3.3",
    "PyJWT>=2.10,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "sqlalchemy>=2.0,<2.1",
    # Explicit security floor: older Starlette releases contain known
    # request-processing vulnerabilities reported by pip-audit.
    "starlette>=1.3.1,<1.7",
    "uvicorn[standard]>=0.34,<0.36",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1.0",
    "pip-audit>=2.10,<3.0",
    "pytest>=9.0.3,<10.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-q -p no:cacheprovider"
testpaths = ["tests"]
